[esp]
; WIFI config
ssid = 
pass = 
; Web file manager on the boot menu (P4 handheld). WiFi is started only
; while the game menu is visible and is shut down before the emulator runs.
; DISABLED BY DEFAULT: the C6 hosted link currently passes ARP/DHCP but not
; unicast IP, so the UI is unreachable. Use the USB-Serial file CLI instead.
; Set web = 1 only after fixing the C6/host data path.
web = 0
web_pass = tiny386pda

[pc]
; /sdcard is the root directory of SD card
bios = /sdcard/bios.bin
vga_bios = /sdcard/vgabios.bin
; try with smaller mem_size/vga_mem_size if it bootloops
mem_size = 7568K
vga_mem_size = 320K
; fdX hdX cdX
hda = /sdcard/win95.img
fill_cmos = 1

[display]
; DO NOT EDIT
width = 480
height = 320

[cpu]
gen = 3
fpu = 0
