; ============================================================
; /sdcard/menu.ini —— 完整示例
; 改完要重启板子才生效（只在开机进菜单时解析一次）
; ============================================================

; ---------- 全局：摇杆方向/死区（逐游戏段不支持，写在这里才有效） ----------
[gamepad]
invertx = 0
inverty = 0
; 径向死区，满量程百分比（0-50，默认 4；越大越不灵敏）
deadzone = 4

; ---------- 例 1：键盘游戏，只覆盖需要改的键 ----------
[game1]
title = PAL                     ; 菜单显示名（最长 31 字符，区分大小写）
cmd = D:\PAL.BAT                ; 进 DOS 后自动输入的命令（最长 95，区分大小写）
thumb = /sdcard/menu/pal_thumb.raw

Up = Up                         ; 十字键（摇杆方向共用这套映射）
Down = Down
Left = Left
Right = Right
A = Space                       ; A 改成空格
B = Enter                       ; B 改成回车
C = Esc
D = Ctrl
Select = F1
OK = Enter
L2 = Shift
R2 = Tab

; ---------- 例 2：鼠标游戏 ----------
[game2]
title = RICH2
cmd = D:\RICH2.BAT
thumb = /sdcard/menu/rich2_thumb.raw

Mouse = 1                       ; 摇杆 = PS/2 鼠标；十字键仍发方向键
MouseL = A                      ; A = 左键（按下 A 不再发 Enter）
MouseR = B                      ; B = 右键（按下 B 不再发 Esc）
; MouseL = none                 ; 不想用按键点击就写 none

; 最多 16 个游戏：[game1] … [game16]
