[gamepad]
invertx=0
inverty=1
; 径向死区，满量程百分比（0-50，默认 4；越大越不灵敏）
deadzone = 4

[game1]
title = PAL
cmd = D:\PAL.BAT
thumb = /sdcard/menu/pal_thumb.raw
; gamepad overrides; every entry is optional and defaults to these values
; Mouse = 0
; Up = Up
; Down = Down
; Left = Left
; Right = Right
; A = Enter
; B = Enter
; X = Enter
; Y = Enter
; Select = F1
; OK = Enter
; L2 = Shift
; R2 = Tab

[game2]
